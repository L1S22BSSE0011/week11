name: wf-ci
on:
  pull_request:
    branches: 
      - develop
    types:
      - opened
      - synchronize
  push:
    branches:
      - develop
jobs:
  linting-job:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome steps
        run: echo "Welcome to pipeline"
      - name: Clone Repo on Runner
        uses: actions/checkout@v4
      - name: Repo Information
        run: |
          git branch
          echo "Event Name ${{github.event_name}}"
          echo "Acyor Name:: ${{github.actor}}" 
      - name: Lint HTML Files
        run: npx htmlhint "**/*.html"
      - name: Lint CSS Files
        run: npx stylelint "**/*.css""
    